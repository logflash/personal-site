<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ian Henriques</title>
    <meta
      name="description"
      content="Ian Henriques — Ph.D. student at MIT working on signal-based foundation models for medical applications."
    />
    <link rel="icon" type="image/png" href="/avatar.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      try {
        if (localStorage.getItem('ian-site-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
      // Some browsers (e.g. Samsung Internet on S Pen devices) report
      // hover support even for finger input, where tapped elements keep
      // their :hover styling until the next tap. Latch into touch mode on
      // the first touch; hover rules are gated on html:not(.touch).
      window.addEventListener(
        'touchstart',
        function () {
          document.documentElement.classList.add('touch')
        },
        { once: true, passive: true },
      )
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Only the weights the stylesheet uses: mono 400; sans 400-700; serif 600 -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
